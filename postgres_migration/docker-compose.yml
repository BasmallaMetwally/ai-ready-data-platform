# docker-compose.yml
# تشغيل PostgreSQL محلي للتطوير بأمر واحد:
#   docker compose up -d
#
# بعدها الـ connection string هيكون:
#   postgresql://ecommerce_user:ecommerce_pass@localhost:5432/ecommerce_dw

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_warehouse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce_dw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql

  # واجهة إدارة بصرية اختيارية (زي phpMyAdmin بس لـ Postgres)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
